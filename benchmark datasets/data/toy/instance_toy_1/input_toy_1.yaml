# input_toy_1.yaml
#
# Configuration file for the micro placement generator (generator.py).
# Toy instance: N=2 nets, seed=35 (paper's S1 smoke-test instance).
# All coordinate and size values are in micrometers (um) unless noted otherwise.
#
# Usage:
#   python generator.py -c input_toy_1.yaml

schema_version: 1

generator:
  seed: 42              # random seed for reproducibility
  g_x: 48               # g_x: minimum horizontal gap between micro bump clusters (um)
  g_y: 48               # g_y: minimum vertical gap between micro bump clusters (um)

# Optimization objectives passed through to the problem formulation.
# Supported values: "routing_length (minimization)", "num_bends (minimization)"
objectives:
  - "routing_length (minimization)"
  - "num_bends (minimization)"
# eta: penalty weight for the bend count in the objective
# objective = total routing length (um) + eta * total bend count
eta: 0.0625  # 2^-4

layout:                 # boundary of the full layout area (um), origin fixed at (0, 0)
  L: 4                  # L: number of routing layers
  W: 304                # W: layout width
  H: 304                # H: layout height

spec:                   # physical dimensions of components (um)
  delta: 4              # delta: unit grid size (= wire width)
  d_micro: 24           # d_micro: micro bump diameter
  d_C4: 40              # d_C4: C4 bump diameter
  d_via: 8              # d_via: via diameter

  # sc_i: bump-to-bump center-to-center spacing (um)
  sc:
    micro: 48           # sc_micro: micro bump pitch (used as the placement grid pitch)
    C4: 152             # sc_C4: C4 bump pitch (used for the candidate grid)

  # sc_{via,i}: via-to-component center-to-center spacing (um)
  # Formula: (d_via + d_i) / 2 + delta
  sc_via:
    micro: 20   # (8+24)/2 + 4
    C4: 28      # (8+40)/2 + 4
    via: 12     # (8+8)/2  + 4

  # sc_{wire,i}: wire-to-component center-to-center spacing (um)
  # Formula: d_i / 2 + (3/2) * delta
  sc_wire:
    micro: 18   # 24/2 + 6
    C4: 26      # 40/2 + 6
    via: 10     # 8/2  + 6
    wire: 8     # 4/2  + 6

# Number of nets per group (G1-G{K}).
signal:
  N: 2                  # N: total number of nets
  K: 1                  # K: number of groups
  G1: 2
  # Cluster size triangular distribution bounds (as fractions of total N).
  c_min: 0.1
  c_max: 0.9

placement:
  q: 3                  # q: side length of the C4 bump density-check window (in C4 pitches)
  p: 6                  # p: maximum number of C4 bumps allowed within any qxq window
  # phi: dummy bump density on the ML layer.
  phi: 1.0              # fully fill empty ML positions with dummy bumps

routing:
  # Constraint: layer_length / total_length <= rho. Set to null (~) for unconstrained.
  # (0.0 is a real constraint that allows no routing length on the layer).
  rho:
    M1: null
    M2: null
    M3: null
    M4: null

  # sigma_k: maximum routing-length skew per group, (max - min) / min <= sigma_k.
  # Set to null (~) for no skew constraint.
  sigma:
    G1: null

output:
  dir: benchmark datasets/data/toy/instance_toy_1
